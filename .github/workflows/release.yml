name: Release

# release-please keeps one open "release" pull request, built from the conventional commits since
# the last release: it bumps `version` in pyproject.toml and uv.lock and writes CHANGELOG.md.
# Merging that pull request tags the release (vX.Y.Z) and creates its GitHub release; the same run
# then builds the package and publishes it to PyPI with trusted publishing (no token is stored).
#
# The PyPI trusted publisher is bound to this file's name (release.yml) and the `pypi`
# environment, so publishing stays here rather than in a workflow started by the tag: a tag made
# with the default GITHUB_TOKEN does not start other workflows anyway.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false # queue, never race two runs mutating the same release PR

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # A pull request made with the default token does not start CI. To have CI run on the
          # release pull request, add a personal access token as RELEASE_PLEASE_TOKEN.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: astral-sh/setup-uv@v6
      - name: The tag is the version
        run: test "v$(uv version --short)" = "${{ needs.release-please.outputs.tag_name }}"
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lorenzo-beyond
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
