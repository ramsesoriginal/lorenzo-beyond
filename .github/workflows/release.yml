name: Release

# release-please keeps one open "release" pull request, built from the conventional commits since
# the last release: it bumps `version` in pyproject.toml and uv.lock and writes CHANGELOG.md.
# Merging that pull request tags the release (vX.Y.Z) and creates its GitHub release; the same run
# then builds the package and publishes it to PyPI with trusted publishing (no token is stored).
#
# The PyPI trusted publisher is bound to this file's name (release.yml) and the `pypi`
# environment, so publishing stays here rather than in a workflow started by the tag: a tag made
# with the default GITHUB_TOKEN does not start other workflows anyway.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false # queue, never race two runs mutating the same release PR

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # A pull request made with the default token does not start CI. To have CI run on the
          # release pull request, add a personal access token as RELEASE_PLEASE_TOKEN.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  # release-please bumps pyproject.toml, never uv.lock, which records the project's own version
  # too, so a release pull request fails `uv sync --locked`. (Its `extra-files` cannot edit
  # uv.lock: tried, and it changed nothing.) So after every run that did not make a release, the
  # release pull request's branch, if there is one, gets the regenerated lock. It looks the
  # branch up by name instead of reading release-please's `pr` output: that output is empty
  # when the pull request already exists and needs no change, which is exactly when this is due.
  sync-lockfile:
    needs: release-please
    if: needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_BRANCH: release-please--branches--main--components--lorenzo-beyond
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
      - name: Is there a release pull request?
        id: branch
        run: |
          if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release branch; nothing to do."
          fi
      - if: steps.branch.outputs.exists == 'true'
        run: git fetch origin "$RELEASE_BRANCH" && git checkout -B "$RELEASE_BRANCH" FETCH_HEAD
      - if: steps.branch.outputs.exists == 'true'
        uses: astral-sh/setup-uv@v6
      - name: Regenerate uv.lock if the version bump left it stale
        if: steps.branch.outputs.exists == 'true'
        run: |
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: sync uv.lock with release-please's version bump"
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: astral-sh/setup-uv@v6
      - name: The tag is the version
        run: test "v$(uv version --short)" = "${{ needs.release-please.outputs.tag_name }}"
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lorenzo-beyond
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
